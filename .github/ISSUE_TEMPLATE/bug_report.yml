name: Bug report
description: Something in the launcher or the game does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English, Russian or Ukrainian. Можно писать по-русски или по-украински.
  - type: input
    id: report
    attributes:
      label: Report code
      description: In the launcher open Settings → Support → Send a report and paste the code it shows. The report carries the launcher journal, game logs and system details, so nobody has to ask for them.
      placeholder: GRB-XXXX-XXXX
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Settings → About.
      placeholder: 2.2.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Minecraft version and loader
      placeholder: 1.21.1, Fabric
