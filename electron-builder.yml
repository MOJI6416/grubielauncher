appId: com.grubielauncher.app
productName: Grubie Launcher

protocols:
  - name: Grubie Launcher
    schemes:
      - grubielauncher

directories:
  output: dist
  buildResources: build

compression: maximum

toolsets:
  appimage: '1.0.3'

electronLanguages:
  - en-US
  - en-GB
  - ru
  - uk

files:
  - '!dist/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.*'
  - '!.claude/**'
  - '!release-notes/**'
  - '!*.tsbuildinfo'
  - '!{eslint.config.mjs,postcss.config.js,components.json}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!**/*.{md,map}'
  - '!**/node_modules/**/{test,tests,__tests__,example,examples,docs,coverage}/**'
  - '!**/node_modules/**/build/Release/obj/**'
  - '!**/node_modules/**/build/Release/*.{pdb,ipdb,iobj,exp,lib,ilk,recipe,tlog}'
  - '!**/node_modules/**/build/*.{vcxproj,filters,sln}'
  - '!**/node_modules/**/build/config.gypi'
  - '!**/node_modules/uiohook-napi/{libuiohook,src}/**'
  - '!**/node_modules/uiohook-napi/binding.gyp'
  - '!**/node_modules/uiohook-napi/prebuilds/{linux-arm64,linux-loong64,win32-arm64}/**'

asarUnpack:
  - resources/**

publish:
  provider: github
  owner: MOJI6416
  repo: grubielauncher
  vPrefixedTagName: false

win:
  target: nsis
  artifactName: ${name}-${version}-setup.${ext}
  executableName: Grubie Launcher
  files:
    - '!**/node_modules/uiohook-napi/prebuilds/{darwin-arm64,darwin-x64,linux-x64}/**'

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  differentialPackage: false

linux:
  target:
    - AppImage
    - deb
  maintainer: grubielauncher.com
  category: Utility
  artifactName: ${name}-${version}.${ext}
  files:
    - '!**/node_modules/uiohook-napi/prebuilds/{darwin-arm64,darwin-x64,win32-x64}/**'
  desktop:
    entry:
      StartupWMClass: grubie-launcher

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${name}-${version}-${arch}.${ext}
  category: public.app-category.games
  minimumSystemVersion: '12.0'
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  electronLanguages:
    - en
    - en_GB
    - ru
    - uk
    - de
    - es
    - fr
    - pl
    - pt_BR
    - tr
  extendInfo:
    NSMicrophoneUsageDescription: Grubie Launcher uses the microphone for voice chat with friends.
    LSMultipleInstancesProhibited: true
  extraResources:
    - from: build/mac
      to: .
      filter:
        - '**/InfoPlist.strings'
  files:
    - '!**/node_modules/uiohook-napi/prebuilds/{linux-x64,win32-x64}/**'

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  writeUpdateInfo: false
